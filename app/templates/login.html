{% extends "base.html" %}{% block title %}Sign in{% endblock %}
{% block content %}
<form method="post" class="card login"><input type="hidden" name="_csrf" value="{{ csrf_token }}">
  <h1>{{ business_name }}</h1><p class="sub">Sign in to manage orders and stock.</p>
  <div class="f"><label for="password">Password</label><input id="password" type="password" name="password" autofocus required></div>
  <button class="btn primary">Sign in</button>
</form>{% endblock %}
